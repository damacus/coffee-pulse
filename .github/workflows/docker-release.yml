name: Publish Docker image

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional image tag for manual runs.'
        required: false
        default: latest

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    name: Build and publish image
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag
        id: image-tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="$RELEASE_TAG"
          elif [[ -n "$INPUT_IMAGE_TAG" ]]; then
            tag="$INPUT_IMAGE_TAG"
          else
            tag="latest"
          fi

          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        name: Build and push image
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
